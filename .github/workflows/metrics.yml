name: Generate GitHub Metrics

on:
  # refresh a few times a day so the cards stay current
  schedule:
    - cron: "0 */6 * * *"
  # let you run it by hand from the Actions tab
  workflow_dispatch:
  # refresh right after you push, so stats reflect new commits
  push:
    branches: [main]
    paths-ignore:
      - "metrics.*.svg"
      - "README.md"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Overview: activity, repositories, and the year contribution calendar.
      # Replaces the github-readme-stats "stats" card.
      - name: Overview card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          # commit with GITHUB_TOKEN so the push does NOT retrigger this workflow
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.overview.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Languages breakdown. Replaces the "top-langs" card.
      - name: Languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.languages.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
